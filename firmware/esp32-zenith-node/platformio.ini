; Zenith Edge node firmware.
;
; NimBLE is used instead of the default Bluedroid stack: it uses roughly
; a quarter of the RAM and flash, which leaves headroom for WiFi.
;
; NOTE: the ESP32-S2 has no Bluetooth radio and cannot run this. Use an
; ESP32, ESP32-C3 or ESP32-S3.

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
